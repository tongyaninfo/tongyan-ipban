<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f6fb;color:#24324b;font-family:Arial,'Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;font-size:1px;line-height:1px;color:#f3f6fb;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{Preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f6fb;">
    <tr><td align="center" style="padding:32px 12px;">
      <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;border-collapse:separate;">
        <tr><td style="padding:0 8px 18px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
            <td style="font-size:21px;font-weight:700;letter-spacing:.3px;color:#172b50;">通研<span style="color:#3168da;"> IPBan</span></td>
            <td align="right" style="font-size:12px;letter-spacing:1px;color:#64748b;">主机安全通知</td>
          </tr></table>
        </td></tr>
        <tr><td style="height:5px;background-color:{{AccentColor}};border-radius:12px 12px 0 0;font-size:0;line-height:5px;">&nbsp;</td></tr>
        <tr><td style="background-color:#ffffff;border-left:1px solid #e3e9f2;border-right:1px solid #e3e9f2;padding:30px 28px 12px;">
          <span style="display:inline-block;background-color:{{BadgeBackground}};color:{{AccentColor}};font-size:12px;font-weight:700;line-height:20px;padding:4px 10px;border-radius:5px;">{{StatusLabel}}</span>
          <h1 style="margin:17px 0 10px;font-size:26px;line-height:1.4;font-weight:700;color:#172b50;">{{Title}}</h1>
          <p style="margin:0;color:#64748b;font-size:13px;line-height:1.8;word-break:break-word;">{{HostName}} &nbsp;·&nbsp; {{OccurredAt}}</p>
        </td></tr>
        <tr><td style="background-color:#ffffff;border-left:1px solid #e3e9f2;border-right:1px solid #e3e9f2;padding:8px 28px 26px;">
          {{Content}}
          {{Details}}
          {{EventRows}}
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px;background-color:#f6f8fc;border-radius:8px;">
            <tr><td style="padding:14px 16px;color:#64748b;font-size:12px;line-height:1.8;">{{Guidance}}</td></tr>
          </table>
        </td></tr>
        <tr><td style="background-color:#ffffff;border:1px solid #e3e9f2;border-top:1px solid #edf0f5;border-radius:0 0 12px 12px;padding:17px 28px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
            <td style="color:#718096;font-size:12px;line-height:1.8;">通研技术 · 通研 IPBan</td>
            <td align="right" style="color:#94a3b8;font-size:11px;line-height:1.8;">自动发送 · 请勿直接回复</td>
          </tr></table>
        </td></tr>
        <tr><td style="padding:16px 12px 0;text-align:center;color:#94a3b8;font-size:11px;line-height:1.8;">通知规则与接收邮箱可在管理台「系统管理 → 通知设置」中调整。<br>时间均为北京时间（UTC+08:00）。</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
